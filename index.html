<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devfinder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- navbar -->
      <div class="navbar">
        <div class="nav-name">
          <h1 class="nav-title">devfinder</h1>
        </div>
        <div class="themeMode">
          <p class="themeMode_title">LIGHT</p>
          <img src="./image/002-sun.svg" alt="light theme icon" />
        </div>
      </div>

      <!-- search -->
      <div class="search-wrapper">
        <div class="left-search">
          <img src="./image/search icon.svg" alt="search icon" />
          <p>Search GitHub username…</p>
        </div>
        <div class="right-search">
          <button class="right-search-btn">Search</button>
        </div>
      </div>

      <!-- profile -->

      <div class="profile-wrappper">
        <div class="profile">
          <div class="profile-img">
            <img
              class="profile-image"
              src="./image/Bitmap.png"
              alt="profile image"
            />
          </div>

          <div class="profile-texts">
            <div class="profile-about">
              <div class="profile-title">
                <div class="profie-name-bio">
                  <div class="profile-name-username">
                    <h2 class="nickname">The Octocat</h2>
                    <p class="username">@octocat</p>
                  </div>
                  <div class="profile-date">
                    <p class="profile-date-text">Joined 25 Jan 2011</p>
                  </div>
                </div>
              </div>
            </div>
        </div>
    </div>
    <div class="stats-wrapper">
            <div class="profile bio">
              <p class="bio">Lorem ipsum, dolor sit amet consectetur adipisicing elit. </p>
            </div>
          <div class="stats-block">
            <div class="stats-name">
              <p class="stats-title">Repos</p>
              <h4 class="stats-num">8</h4>
            </div>
            <div class="stats-name">
              <p class="stats-title">Followers</p>
              <h4 class="stats-num">3938</h4>
            </div>
            <div class="stats-name">
              <p class="stats-title">Following</p>
              <h4 class="stats-num">9</h4>
            </div>
          </div>

          <div class="social-links">
            <div class="left-link">
              <div class="link">
                <img
                  class="link-icon"
                  src="./image/map icon.svg"
                  alt="map icon"
                />
                <p class="link-name">San Francisco</p>
              </div>
              <div class="link">
                <img src="./image/link icon.svg" alt="link icon" />
                <p class="link-name">https://github.blog</p>
              </div>
            </div>

            <div class="right-link">
              <div class="link twitter-link">
                <img src="./image/twitter-icon.svg" alt="twitter" />
                <p class="link-name">Not Available</p>
              </div>
              <div class="link">
                <img src="./image/office-icon.svg" alt="office icon" />
                <p class="link-name">@github</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
